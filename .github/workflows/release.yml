name: Release

on:
  push:
    branches:
      - publish

permissions:
  contents: write

env:
  APP_NAME: git-exp
  VERSION: "0.1.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact_suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux multi-piattaforma (x86_64 + ARM64)
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-aarch64
            ext: ""

          # Windows (x86_64 + ARM64)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_suffix: windows-aarch64
            ext: ".exe"

          # macOS (Intel x86_64 + Apple Silicon ARM64)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ${{ env.APP_NAME }}

      - name: Prepare release asset (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.APP_NAME }}"
          ASSET_NAME="${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.artifact_suffix }}"
          cp "$BIN_PATH" "dist/$ASSET_NAME"
          chmod +x "dist/$ASSET_NAME"

      - name: Prepare release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $BinPath = "target/${{ matrix.target }}/release/${{ env.APP_NAME }}.exe"
          $AssetName = "${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.artifact_suffix }}.exe"
          Copy-Item $BinPath "dist/$AssetName"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ matrix.artifact_suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > "${{ env.APP_NAME }}-${{ env.VERSION }}-sha256sums.txt"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}
          target_commitish: publish
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*

